name: CI

# Corre en cada pull request y en cada cambio a master.
# Si algo falla, el pull request queda marcado en rojo y no debería aplicarse.
on:
  pull_request:
  push:
    branches: [master]

jobs:
  backend:
    runs-on: ubuntu-latest

    # Base PostgreSQL de pruebas para las pruebas de integración (se crea y se borra en cada corrida).
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cme_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Compilar
        run: npm run build
      - name: Pruebas automáticas (incluye integración con PostgreSQL)
        run: npm test
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/cme_test
